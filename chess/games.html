<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brady Tournament Games</title>
<script src="https://cdn.jsdelivr.net/npm/@mliebelt/pgn-viewer@1.6.11/lib/dist.js"></script>
<style>
  * {
    box-sizing: border-box;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    max-width: 900px;
    margin: 2rem auto;
    padding: 0 1rem;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 0.5rem;
    -webkit-user-select: none;
    user-select: none;
  }
  h1 {
    font-size: 1.4rem;
    margin: 0.5rem 0;
    -webkit-user-select: none;
    user-select: none;
  }
  #theme-select {
    font-size: 1rem;
    padding: 0.35rem 0.5rem;
  }
  #board-wrap {
    position: relative;
    width: 100%;
    max-width: 560px;
    margin: 0 auto;
    -webkit-user-select: none;
    user-select: none;
  }
  #board-frame {
    position: absolute;
    box-sizing: border-box;
    border-style: solid;
    pointer-events: none;
    display: none;
  }
  #board .buttons {
    height: auto !important;
    gap: 10px;
    justify-content: center;
    align-items: center;
    padding: 6px 0;
    margin-top: 12px;
  }
  #board .pgnvbutton {
    width: 44px !important;
    height: 44px !important;
    font-size: 26px !important;
    line-height: 44px !important;
    padding: 0 !important;
    box-sizing: border-box;
    display: flex !important;
    align-items: center;
    justify-content: center;
  }
  #board.brown cg-board,
  #board .brown cg-board {
    background-image: url('img/board/wood-brown.png') !important;
  }
  #board select.games {
    font-size: 1rem;
    padding: 0.35rem 0.5rem;
    margin-bottom: 12px;
  }
</style>
</head>
<body>
<div class="header-row">
  <h1>Brady's Games</h1>
  <select id="theme-select">
    <option value="blue">Blue</option>
    <option value="brown" selected>Brown</option>
    <option value="falken">Falken</option>
    <option value="informator">Informator</option>
    <option value="sportverlag">Sportverlag</option>
    <option value="zeit">Zeit</option>
  </select>
</div>
<div id="board-wrap"><div id="board"></div><div id="board-frame"></div></div>
<script>
  var wrapEl = document.getElementById('board-wrap');
  var boardEl = document.getElementById('board');
  var frameEl = document.getElementById('board-frame');
  var themeSelect = document.getElementById('theme-select');
  var pgnText = null;
  var resizeTimer = null;
  var lastWidth = null;
  var lastTheme = null;
  var FRAME_BORDER = 14; // visual thickness of the frame
  var FRAME_OVERLAP = 2; // extra px the border eats into the board, to
                          // hide the ~1px subpixel gap that can appear on
                          // the far (right/bottom) edges from fractional
                          // layout rounding
  var THEME_COLORS = {
    brown: '#5c3924'
  };
  var DEFAULT_FRAME_COLOR = '#ffffff';

  function computedBoardWidth() {
    // pgnView sets an inline width directly on #board, so measure the
    // untouched wrapper instead to get the space actually available at
    // the current viewport size.
    var w = Math.floor(wrapEl.clientWidth) || window.innerWidth - 32;
    return Math.max(240, Math.min(560, w));
  }

  // pgnView sizes its internal chessground elements itself, in pixels,
  // independent of any CSS we add to them - a border added directly there
  // fights that sizing and clips. Instead, position an absolutely-placed
  // overlay frame around the rendered board's actual bounding box, so it
  // can't conflict with pgnView's own layout math.
  function positionFrame() {
    var cgWrap = boardEl.querySelector('.cg-wrap');
    if (!cgWrap) {
      frameEl.style.display = 'none';
      return;
    }
    var wrapRect = wrapEl.getBoundingClientRect();
    var boardRect = cgWrap.getBoundingClientRect();
    frameEl.style.display = 'block';
    frameEl.style.borderColor = THEME_COLORS[themeSelect.value] || DEFAULT_FRAME_COLOR;
    // Position/size the frame using the visual border thickness, but make
    // the actual CSS border a bit thicker (FRAME_OVERLAP more) so it eats
    // slightly into the board on every side - covering any subpixel gap
    // without changing how thick the frame looks from outside.
    frameEl.style.borderWidth = (FRAME_BORDER + FRAME_OVERLAP) + 'px';
    frameEl.style.left = (boardRect.left - wrapRect.left - FRAME_BORDER) + 'px';
    frameEl.style.top = (boardRect.top - wrapRect.top - FRAME_BORDER) + 'px';
    frameEl.style.width = (boardRect.width + FRAME_BORDER * 2) + 'px';
    frameEl.style.height = (boardRect.height + FRAME_BORDER * 2) + 'px';
  }

  // chessground sometimes computes cg-container/cg-board's inline size
  // from a stale (pre-layout) reading of cg-wrap's rect, baking in a
  // wrong - occasionally zero-height - size and leaving a gap between the
  // board and its frame. It also reapplies this on its own (e.g. on a
  // native window resize) independent of our render() calls, so a
  // one-time fix isn't enough. Its base CSS already defines both elements
  // as 100% of cg-wrap (always sized correctly) - watch for it clobbering
  // that and strip the bad inline override back out every time.
  function clearBadSize(el) {
    if (el.style.width || el.style.height) {
      el.style.removeProperty('width');
      el.style.removeProperty('height');
    }
  }
  var sizeGuard = new MutationObserver(function (mutations) {
    mutations.forEach(function (m) {
      clearBadSize(m.target);
    });
    positionFrame();
  });

  function render() {
    var width = computedBoardWidth();
    var theme = themeSelect.value;
    if (width === lastWidth && theme === lastTheme) {
      return;
    }
    lastWidth = width;
    lastTheme = theme;
    boardEl.innerHTML = '';
    PGNV.pgnView('board', {
      pgn: pgnText,
      manyGames: true,
      theme: theme,
      showCoords: false,
      width: width + 'px'
    });
    sizeGuard.disconnect();
    boardEl.querySelectorAll('cg-container, cg-board').forEach(function (el) {
      clearBadSize(el);
      sizeGuard.observe(el, { attributes: true, attributeFilter: ['style'] });
    });
    positionFrame();
  }

  fetch('games.pgn')
    .then(function (response) {
      if (!response.ok) {
        throw new Error('HTTP ' + response.status);
      }
      return response.text();
    })
    .then(function (pgn) {
      pgnText = pgn;
      render();
      window.addEventListener('resize', function () {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(render, 250);
      });
      window.addEventListener('orientationchange', function () {
        setTimeout(render, 250);
      });
      themeSelect.addEventListener('change', render);
    })
    .catch(function (err) {
      boardEl.textContent = 'Failed to load games.pgn: ' + err;
    });
</script>
</body>
</html>
