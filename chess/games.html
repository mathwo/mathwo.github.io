<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Brady Tournament Games</title>
<script src="https://cdn.jsdelivr.net/npm/@mliebelt/pgn-viewer@1.6.11/lib/dist.js"></script>
<style>
  * {
    box-sizing: border-box;
  }
  html {
    touch-action: manipulation;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    max-width: 900px;
    margin: 2rem auto;
    padding: 0 1rem;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 0.5rem;
    -webkit-user-select: none;
    user-select: none;
  }
  h1 {
    font-size: 1.4rem;
    margin: 0.5rem 0;
    -webkit-user-select: none;
    user-select: none;
  }
  #theme-select {
    font-size: 1rem;
    padding: 0.35rem 0.5rem;
  }
  #board-wrap {
    position: relative;
    width: 100%;
    max-width: 560px;
    margin: 0 auto;
    -webkit-user-select: none;
    user-select: none;
  }
  #board-frame {
    position: absolute;
    box-sizing: border-box;
    border-style: solid;
    pointer-events: none;
    display: none;
  }
  #board .buttons {
    height: auto !important;
    gap: 10px;
    justify-content: center;
    align-items: center;
    padding: 6px 0;
    margin-top: 12px;
  }
  #board .pgnvbutton {
    width: 44px !important;
    height: 44px !important;
    font-size: 26px !important;
    line-height: 44px !important;
    padding: 0 !important;
    box-sizing: border-box;
    display: flex !important;
    align-items: center;
    justify-content: center;
  }
  #board.brown cg-board,
  #board .brown cg-board {
    background-image: url('img/board/wood-brown.png') !important;
  }
  #board select.games {
    font-size: 1rem;
    padding: 0.35rem 0.5rem;
    margin-bottom: 12px;
  }
  .controls {
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  #copy-link-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 2.4rem;
    height: 2.4rem;
    border: 1px solid #ccc;
    border-radius: 6px;
    background: #fff;
    color: #333;
    cursor: pointer;
    padding: 0;
    flex: none;
  }
  #copy-link-btn:hover {
    background: #f2f2f2;
  }
  #copy-link-btn.copied {
    color: #1a7f37;
    border-color: #1a7f37;
  }
</style>
</head>
<body>
<div class="header-row">
  <h1>Brady's Games</h1>
  <div class="controls">
    <select id="theme-select">
      <option value="blue">Blue</option>
      <option value="brown" selected>Brown</option>
      <option value="falken">Falken</option>
      <option value="informator">Informator</option>
      <option value="sportverlag">Sportverlag</option>
      <option value="zeit">Zeit</option>
    </select>
    <button id="copy-link-btn" type="button" title="Copy link to this game" aria-label="Copy link to this game">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
    </button>
  </div>
</div>
<div id="board-wrap"><div id="board"></div><div id="board-frame"></div></div>
<script>
  var wrapEl = document.getElementById('board-wrap');
  var boardEl = document.getElementById('board');
  var frameEl = document.getElementById('board-frame');
  var themeSelect = document.getElementById('theme-select');
  var copyBtn = document.getElementById('copy-link-btn');
  var pgnText = null;
  var resizeTimer = null;
  var lastWidth = null;
  var lastTheme = null;
  var currentGameIndex = 0;
  var FRAME_BORDER = 14; // visual thickness of the frame
  var FRAME_OVERLAP = 2; // extra px the border eats into the board, to
                          // hide the ~1px subpixel gap that can appear on
                          // the far (right/bottom) edges from fractional
                          // layout rounding
  var THEME_COLORS = {
    brown: '#5c3924'
  };
  var DEFAULT_FRAME_COLOR = '#ffffff';

  function computedBoardWidth() {
    // pgnView sets an inline width directly on #board, so measure the
    // untouched wrapper instead to get the space actually available at
    // the current viewport size.
    var w = Math.floor(wrapEl.clientWidth) || window.innerWidth - 32;
    return Math.max(240, Math.min(560, w));
  }

  // pgnView sizes its internal chessground elements itself, in pixels,
  // independent of any CSS we add to them - a border added directly there
  // fights that sizing and clips. Instead, position an absolutely-placed
  // overlay frame around the rendered board's actual bounding box, so it
  // can't conflict with pgnView's own layout math.
  function positionFrame() {
    var cgWrap = boardEl.querySelector('.cg-wrap');
    if (!cgWrap) {
      frameEl.style.display = 'none';
      return;
    }
    var wrapRect = wrapEl.getBoundingClientRect();
    var boardRect = cgWrap.getBoundingClientRect();
    frameEl.style.display = 'block';
    frameEl.style.borderColor = THEME_COLORS[themeSelect.value] || DEFAULT_FRAME_COLOR;
    // Position/size the frame using the visual border thickness, but make
    // the actual CSS border a bit thicker (FRAME_OVERLAP more) so it eats
    // slightly into the board on every side - covering any subpixel gap
    // without changing how thick the frame looks from outside.
    frameEl.style.borderWidth = (FRAME_BORDER + FRAME_OVERLAP) + 'px';
    frameEl.style.left = (boardRect.left - wrapRect.left - FRAME_BORDER) + 'px';
    frameEl.style.top = (boardRect.top - wrapRect.top - FRAME_BORDER) + 'px';
    frameEl.style.width = (boardRect.width + FRAME_BORDER * 2) + 'px';
    frameEl.style.height = (boardRect.height + FRAME_BORDER * 2) + 'px';
  }

  // chessground sometimes computes cg-container/cg-board's inline size
  // from a stale (pre-layout) reading of cg-wrap's rect, baking in a
  // wrong - occasionally zero-height - size and leaving a gap between the
  // board and its frame. It also reapplies this on its own (e.g. on a
  // native window resize) independent of our render() calls, so a
  // one-time fix isn't enough. Its base CSS already defines both elements
  // as 100% of cg-wrap (always sized correctly) - watch for it clobbering
  // that and strip the bad inline override back out every time.
  function clearBadSize(el) {
    if (el.style.width || el.style.height) {
      el.style.removeProperty('width');
      el.style.removeProperty('height');
    }
  }
  var sizeGuard = new MutationObserver(function (mutations) {
    mutations.forEach(function (m) {
      clearBadSize(m.target);
    });
    positionFrame();
  });

  function getIndexFromUrl() {
    var params = new URLSearchParams(window.location.search);
    var idx = parseInt(params.get('index'), 10);
    return isNaN(idx) || idx < 0 ? 0 : idx;
  }

  // The games <select> pgnView builds (id "boardGames") is recreated from
  // scratch on every render() call, so any selection we set on it has to be
  // reapplied each time - this both restores currentGameIndex after a
  // rebuild and re-wires the listener that keeps currentGameIndex in sync
  // with the user manually switching games.
  function applyGameSelection() {
    var gamesSelect = document.getElementById('boardGames');
    if (!gamesSelect || !gamesSelect.options.length) {
      return;
    }
    var maxIndex = gamesSelect.options.length - 1;
    var idx = Math.min(Math.max(currentGameIndex, 0), maxIndex);
    if (parseInt(gamesSelect.value, 10) !== idx) {
      gamesSelect.value = String(idx);
      gamesSelect.dispatchEvent(new Event('change'));
    }
    currentGameIndex = idx;
    gamesSelect.addEventListener('change', function () {
      currentGameIndex = parseInt(gamesSelect.value, 10) || 0;
    });
  }

  function render() {
    var width = computedBoardWidth();
    var theme = themeSelect.value;
    if (width === lastWidth && theme === lastTheme) {
      return;
    }
    lastWidth = width;
    lastTheme = theme;
    boardEl.innerHTML = '';
    PGNV.pgnView('board', {
      pgn: pgnText,
      manyGames: true,
      theme: theme,
      showCoords: false,
      width: width + 'px'
    });
    sizeGuard.disconnect();
    boardEl.querySelectorAll('cg-container, cg-board').forEach(function (el) {
      clearBadSize(el);
      sizeGuard.observe(el, { attributes: true, attributeFilter: ['style'] });
    });
    positionFrame();
    applyGameSelection();
  }

  fetch('games.pgn')
    .then(function (response) {
      if (!response.ok) {
        throw new Error('HTTP ' + response.status);
      }
      return response.text();
    })
    .then(function (pgn) {
      pgnText = pgn;
      currentGameIndex = getIndexFromUrl();
      render();
      window.addEventListener('resize', function () {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(render, 250);
      });
      window.addEventListener('orientationchange', function () {
        setTimeout(render, 250);
      });
      themeSelect.addEventListener('change', render);
    })
    .catch(function (err) {
      boardEl.textContent = 'Failed to load games.pgn: ' + err;
    });

  var COPY_ICON = copyBtn.innerHTML;
  var CHECK_ICON = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';
  var copyResetTimer = null;

  copyBtn.addEventListener('click', function () {
    var url = new URL(window.location.href);
    url.searchParams.set('index', currentGameIndex);
    var text = url.toString();

    function showCopied() {
      copyBtn.innerHTML = CHECK_ICON;
      copyBtn.classList.add('copied');
      clearTimeout(copyResetTimer);
      copyResetTimer = setTimeout(function () {
        copyBtn.innerHTML = COPY_ICON;
        copyBtn.classList.remove('copied');
      }, 1200);
    }

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(showCopied).catch(function () {
        window.prompt('Copy this link:', text);
      });
    } else {
      window.prompt('Copy this link:', text);
    }
  });
</script>
</body>
</html>
